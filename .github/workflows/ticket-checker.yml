name: Ticket Status Checker

on:
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TICKET_URL_POST: ${{ secrets.TICKET_URL_POST }}
      TICKET_URL_TOP: ${{ secrets.TICKET_URL_TOP }}

    steps:
      - name: Check Ticket Status
        id: check
        run: |
          # --- 1. 準備 ---
          pip install beautifulsoup4

          curl -s https://ifconfig.me
          echo ""
          
          echo "チケットの状況を確認します..."

          # --- 2. 実行: HTML取得 ---
          # 失敗しても止まらないように '|| true' をつける
          curl -s -o response_body.html -w "%{http_code}" -X POST "$TICKET_URL_POST" \
            -d "afid=" -d "tid=" -d "slcd=" -d "acptNo=" \
            -d "firstModalFlg=true" -d "simpleAuthFlg=true" -d "lpViewFlg=true" > status_code.txt || true
          
          HTTP_STATUS=$(cat status_code.txt)
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "HTTP Error ($HTTP_STATUS). チェック失敗。"
            echo "available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- 3. 解析: Pythonで画像を判定 ---
          python3 -c "
          import os
          import sys
          from bs4 import BeautifulSoup

          try:
              with open('response_body.html', 'r', encoding='utf-8', errors='ignore') as f:
                  html = f.read()
          except FileNotFoundError:
              print('Error: HTML file not found')
              sys.exit(1)

          soup = BeautifulSoup(html, 'html.parser')

          # ページが正常かチェック
          if not soup.find('body'):
              print('FAILURE: ページの中身が不正です')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  print('available=false', file=fh)
              sys.exit(0)

          # 【判定ロジック】
          # クラス名 'btn-seat-status-label-img' を持つ画像（購入ボタンのアイコン）を全て取得
          status_images = soup.select('.btn-seat-status-label-img')
          
          if not status_images:
              print('WARNING: 判定対象の画像が見つかりませんでした（ページ構成変更の可能性）')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  print('available=false', file=fh)
              sys.exit(0)

          found_available = False

          print(f'判定対象のボタン数: {len(status_images)} 個')

          for img in status_images:
              alt_text = img.get('alt', '')
              
              # '空席あり' または '残りわずか' が含まれていれば購入可能と判断
              if '空席あり' in alt_text or '残りわずか' in alt_text:
                  print(f'SUCCESS: 購入可能な席が見つかりました！ ({alt_text})')
                  found_available = True
                  break
              
              # デバッグ用: どんなステータスだったか表示
              # print(f'Status: {alt_text}') 

          if found_available:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  print('available=true', file=fh)
          else:
              print('FAILURE: すべて売り切れ、または取扱なしです。')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  print('available=false', file=fh)
          "

      - name: Send Email Notification
        if: steps.check.outputs.available == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "チケット購入可能のお知らせ"
          body: "チケットが購入可能になりました！\n\nURL: ${{ env.TICKET_URL_TOP }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
