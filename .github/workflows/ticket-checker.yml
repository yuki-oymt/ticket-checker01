# ワークフローの名前
name: Ticket Status Checker

# ワークフローを実行するタイミング
on:
  schedule:
    # JST 09:00 - 23:55 まで5分おきに実行
    # UTC 00:00 - 14:00 (0-14)
    - cron: '*/5 0-14 * * *'
workflow_dispatch:

# 実行するジョブ
jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    
    env:
      TICKET_URL_POST: "https://ticket.pia.jp/sp/ticketInformation.do?eventCd=2548300&rlsCd=001"
      TICKET_URL_TOP: "https://w.pia.jp/p/sixtones26ip-aco/"

    steps:
      - name: Check Ticket Status
        id: check
        run: |
          SEARCH_STRING="label-release none'>予定枚数終了"
          MAX_RETRIES=20   # 20回リトライ（×1分 = 最大20分稼働）

          echo "チケットの監視を開始します（最大20回試行）..."

          # 1から30までループ
          for (( i=1; i<=MAX_RETRIES; i++ )); do
            echo "【試行回数: $i/$MAX_RETRIES】 ステータス確認中..."

            # curl実行（ステータスコードと本文を取得）
            HTTP_STATUS=$(curl -s -o response_body.html -w "%{http_code}" -X POST "$TICKET_URL_POST" \
              -d "afid=" -d "tid=" -d "slcd=" -d "acptNo=" \
              -d "firstModalFlg=true" -d "simpleAuthFlg=true" -d "lpViewFlg=true")
            
            RESPONSE=$(cat response_body.html)

            # 1. HTTPステータスコードのチェック (200以外は失敗とみなしてリトライ)
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "HTTP Error ($HTTP_STATUS). リトライします..."
              # リトライ処理へ進む（下部のsleepへ）
            
            # 2. 「予定枚数終了」が含まれて【いない】かチェック (成功判定)
            elif ! echo "$RESPONSE" | grep -q "$SEARCH_STRING"; then
              echo "SUCCESS: チケットは現在購入可能です！"
              echo "available=true" >> $GITHUB_OUTPUT
              
              # 見つかったので成功終了（ループを抜けて次のステップへ）
              exit 0
            
            else
              # 3. 「予定枚数終了」が含まれている場合
              echo "FAILURE: 予定枚数終了（Sold Out）です。"
            fi

            # まだループ回数が残っている場合、1分待機
            if [ $i -lt $MAX_RETRIES ]; then
              echo "1分待機して再度チェックします..."
              sleep 60
            else
              echo "GIVE UP: リトライ上限に達しました。"
            fi
          done

          # ループを抜けた（＝20回ともダメだった）場合
          echo "available=false" >> $GITHUB_OUTPUT
      
      - name: Send Email Notification
        if: steps.check.outputs.available == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "チケット購入可能のお知らせ"
          body: "チケットが購入可能になりました！\n\nURL: ${{ env.TICKET_URL_TOP }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
